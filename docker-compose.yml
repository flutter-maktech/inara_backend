version: '3.9'

# ============================================================
# DOCKER COMPOSE — Inara Backend (Coolify / Production)
# ============================================================

services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inara_backend
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-Inara}
      DEBUG: ${DEBUG:-false}
      API_V1_PREFIX: ${API_V1_PREFIX:-/api/v1}

      # Prisma requires postgresql://, not postgres://
      # The validator in config.py auto-corrects this, but set correctly here too.
      DATABASE_URL: ${DATABASE_URL}

      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}

      SMTP_TLS: ${SMTP_TLS:-true}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAILS_FROM_EMAIL: ${EMAILS_FROM_EMAIL:-}
      EMAILS_FROM_NAME: ${EMAILS_FROM_NAME:-Inara App™}

      # Comma-separated, no brackets, no quotes.
      # e.g.: https://app.example.com,https://www.example.com
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}

      BACKEND_PORT: ${BACKEND_PORT:-8000}

    ports:
      - "${BACKEND_PORT:-8000}:8000"